# Publishes a read-only static snapshot of the site to GitHub Pages on every
# push to main: https://bambozya.github.io/lahga
# It is a fallback only. The live site at https://lahga.fyi runs on the netcup
# server and is deployed by Coolify (see "Production" in the README).
#
# The snapshot is generated from the seed data (no external database). Voting
# and contributing need the real server and are not available in this build.
name: Deploy static snapshot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate static site
        run: npx nuxt generate
        env:
          NUXT_APP_BASE_URL: /lahga/
          LAHGA_STATIC: '1'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
